# Test list for run.py (Phase 2 Task 15 [support]). Every simulation runs through run.py (SC6 later needs
# no new plumbing).
#
#   envs:    how to build and start an environment: filelist (compile list), top (top module), dpi (DPI-C
#            sources, optional), gating (optional, default false: true when the top declares the parameter
#            GATING_EN; only then does run.py pass -GGATING_EN=0|1 for --config d0|d1; run.py refuses
#            --config d1 for a target that needs an env without it, which would silently run as D0)
#            (a YAML bool: run.py rejects any other value, e.g. the string "false")
#   tests:   env, expected result (pass | fail, default pass) and, for an expected-fail test, the only
#            UVM_ERROR / UVM_FATAL IDs it may report (each must appear at least once); seeds (optional,
#            an integer >= 1, default 1): run.py runs seeds 1..seeds of the test unless --seeds N is given
#   suites:  named lists for --target. An entry is a test, or another suite when no test has that name;
#            run.py expands suites recursively, runs each test once, and stops on a cycle
envs:
  mac:
    filelist: tb/uvm/mac_env/mac_dv.f
    top: mac_tb_top
    dpi: [model/c/npu_ref.c]
    gating: true
  # dummy tests that check run.py's own judgement (sim/selftest/check_run_py.py); no DUT, no DPI
  selftest:
    filelist: sim/selftest/selftest_dv.f
    top: selftest_tb_top

tests:
  mac_single_k4:               {env: mac}
  mac_k_kmax:                  {env: mac}
  mac_k0:                      {env: mac}
  mac_k_too_big:               {env: mac}
  mac_k_mod4:                  {env: mac}
  mac_misaligned:              {env: mac}
  mac_addr_oob:                {env: mac}
  mac_addr_wraps_32bit:        {env: mac}
  mac_illegal:                 {env: mac}
  mac_clr_vs_accum:            {env: mac}
  mac_forced_wrap:             {env: mac}
  mac_fifo_full:               {env: mac}
  mac_read_while_busy:         {env: mac}
  mac_w1c:                     {env: mac}
  # W1C while an erroneous command is still queued (the predictor applies commands at CHECK)
  mac_w1c_inflight:            {env: mac}
  # D23: error-bit set wins over a W1C in the same cycle
  mac_d23:                     {env: mac}
  # D17: npu_busy_cyc counts busy cycles; a write in a busy cycle wins
  mac_busy_cyc:                {env: mac}
  # review F9a: a dropped LOAD at DTCM_BASE must not hit cg_addr first_quad
  mac_addr_cov_dropped:        {env: mac}
  mac_mem_mirror_check:        {env: mac}
  # self-test of the end-of-test mirror check (Review Focus 2)
  mac_mem_mirror_inject:       {env: mac, expect: fail, expect_ids: [MEM_MIRROR]}
  # self-test of the WAR check (spec 6.3 rule 5): a DTCM write while a LOAD is queued
  mac_war_inject:              {env: mac, expect: fail, expect_ids: [WAR_RULE]}
  # Review Focus 4: a COMPUTE that reads unwritten buffer entries is a test error
  mac_unwritten_entry_flagged: {env: mac, expect: fail, expect_ids: [UNWRITTEN_ENTRY]}
  # Task 19: every op x K bin x K mod 4 cell of cg_cmd (spec 10.5, D24), with the error bits checked
  mac_k_cross:                 {env: mac}
  # Task 19: a reset in the middle of a LOAD leaves no spurious cg_state transition (review minor F9b)
  mac_reset_midrun:            {env: mac}
  # Step 6: mac_rand_seq, random op mix (spec 10.3). The plan asks for >= 200 seeds: run.py runs seeds
  # 1..200 of it unless --seeds N is given (the 200-seed runs of 2026-11-07 and of Task 19 used 1..200)
  mac_rand:                    {env: mac, seeds: 200}
  # run_py_selftest: dummy tests (sim/selftest/selftest_tb.sv). selftest_sva and selftest_no_summary are
  # deliberately not listed; sim/selftest/check_run_py.py adds them to a temporary list.
  selftest_pass:               {env: selftest}
  selftest_fail:               {env: selftest, expect: fail, expect_ids: [SELFTEST_FAIL]}
  selftest_fatal:              {env: selftest, expect: fail, expect_ids: [SELFTEST_FATAL]}

suites:
  mac_directed:
    - mac_single_k4
    - mac_k_kmax
    - mac_k0
    - mac_k_too_big
    - mac_k_mod4
    - mac_misaligned
    - mac_addr_oob
    - mac_addr_wraps_32bit
    - mac_illegal
    - mac_clr_vs_accum
    - mac_forced_wrap
    - mac_fifo_full
    - mac_read_while_busy
    - mac_w1c
    - mac_w1c_inflight
    - mac_d23
    - mac_busy_cyc
    - mac_addr_cov_dropped
    - mac_mem_mirror_check
    - mac_mem_mirror_inject
    - mac_war_inject
    - mac_unwritten_entry_flagged
    - mac_k_cross
    - mac_reset_midrun
  mac_rand:
    - mac_rand
  # Task 19's regression of the engine (the mac_directed tests once, mac_rand with its 200 seeds); also
  # the first nested suite: python run.py --target mac_regress --config d0 --cov
  mac_regress:
    - mac_directed
    - mac_rand
  selftest:
    - selftest_pass
    - selftest_fail
    - selftest_fatal
