<svg xmlns="http://www.w3.org/2000/svg" fill="#142433" width="1700" height="820" viewBox="0 0 1700 820" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
