    <rect x="1322" y="542" width="22" height="22" rx="3"/><rect x="1350" y="542" width="22" height="22" rx="3"/><rect x="1378" y="542" width="22" height="22" rx="3"/><rect x="1406" y="542" width="22" height="22" rx="3"/>
    <rect x="1322" y="570" width="22" height="22" rx="3"/><rect x="1350" y="570" width="22" height="22" rx="3"/><rect x="1378" y="570" width="22" height="22" rx="3"/><rect x="1406" y="570" width="22" height="22" rx="3"/>
